name: snapshot

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Create source-lines token
        id: source_lines_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_LINES_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_LINES_APP_PRIVATE_KEY }}
          owner: solanab
          repositories: source-lines
          permission-contents: read
      - name: Install repository tools
        env:
          GH_TOKEN: ${{ steps.source_lines_token.outputs.token }}
        run: just install
      - name: Check
        run: just check
      - name: Build snapshot
        run: just release-snapshot
      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nsk-snapshot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
